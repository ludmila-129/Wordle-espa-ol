


<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
#app { max-width: 480px; margin: 0 auto; padding: 1rem; }
h1 { text-align: center; font-size: 22px; font-weight: 500; color: var(--color-text-primary); border-bottom: 0.5px solid var(--color-border-tertiary); padding-bottom: 0.75rem; margin-bottom: 0.75rem; letter-spacing: 2px; }
#category-hint {
  text-align: center; font-size: 13px; font-weight: 500;
  color: var(--color-text-info);
  background: var(--color-background-info);
  border-radius: var(--border-radius-md);
  padding: 6px 14px; margin: 0 auto 1rem;
  display: inline-block; width: auto;
  left: 50%; position: relative; transform: translateX(-50%);
  letter-spacing: 0.5px;
}
#hint-wrap { text-align: center; margin-bottom: 0.75rem; min-height: 32px; }
#board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; margin: 0 auto 1.25rem; width: 280px; }
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tile {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 500;
  border: 2px solid var(--color-border-secondary);
  border-radius: 4px;
  color: var(--color-text-primary);
  background: var(--color-background-primary);
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  text-transform: uppercase;
}
.tile.correct { background: #538D4E; color: #fff; border-color: #538D4E; }
.tile.present { background: #B59F3B; color: #fff; border-color: #B59F3B; }
.tile.absent  { background: #3A3A3C; color: #fff; border-color: #3A3A3C; }
.tile.active  { border-color: var(--color-border-primary); }
.tile.pop { animation: pop 0.1s ease; }
.tile.shake { animation: shake 0.4s ease; }
.tile.flip { animation: flip 0.5s ease forwards; }
@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)} }
@keyframes flip { 0%{transform:rotateX(0)} 50%{transform:rotateX(-90deg)} 100%{transform:rotateX(0)} }
#keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.kb-row { display: flex; gap: 5px; }
.key {
  height: 54px; min-width: 36px; padding: 0 8px;
  border-radius: 4px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; text-transform: uppercase;
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, color 0.2s;
  user-select: none;
}
.key.wide { min-width: 54px; font-size: 12px; }
.key.correct { background: #538D4E; color: #fff; }
.key.present { background: #B59F3B; color: #fff; }
.key.absent  { background: #3A3A3C; color: #fff; }
#msg { text-align: center; min-height: 28px; font-size: 14px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 0.5rem; }
#play-again { display: none; margin: 0.75rem auto 0; padding: 10px 28px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 14px; cursor: pointer; font-family: var(--font-sans); }
#play-again:hover { background: var(--color-background-secondary); }
</style>

<div id="app">
  <h2 class="sr-only">Wordle en español (A1-A2) Adivina la palabra de 5 letras. ¡Tienes 6 intentos!</h2>
  <h1>WORDLE</h1>
  <div id="hint-wrap"><span id="category-hint"></span></div>
  <div id="board"></div>
  <div id="msg"></div>
  <button id="play-again" onclick="initGame()">Jugar de nuevo</button>
  <div id="keyboard"></div>
</div>

<script>
// [word, category_key]
const WORD_LIST = [
  // Animales singular
  ["PERRO","animal"],["CABRA","animal"],["OVEJA","animal"],["CERDO","animal"],
  ["POLLO","animal"],["TIGRE","animal"],["BURRO","animal"],["ZORRO","animal"],
  ["CEBRA","animal"],["MOSCA","animal"],["PALOMA","animal"],
  // Animales plural
  ["GATOS","animal_pl"],["PATOS","animal_pl"],["RANAS","animal_pl"],["LOBOS","animal_pl"],
  ["VACAS","animal_pl"],

  // Comida singular
  ["LECHE","comida"],["QUESO","comida"],["CARNE","comida"],["ARROZ","comida"],
  ["PASTA","comida"],["TARTA","comida"],["FRUTA","comida"],["MANGO","comida"],
  ["LIMON","comida"],["MELON","comida"],["SALSA","comida"],["PIZZA","comida"],
  ["JAMON","comida"],["DULCE","comida"],["CREMA","comida"],
  // Comida plural
  ["SOPAS","comida_pl"],["TAPAS","comida_pl"],["PASAS","comida_pl"],
  ["LATAS","comida_pl"],["TAZAS","comida_pl"],["COCOS","comida_pl"],
  ["PERAS","comida_pl"],["CENAS","comida_pl"],["TORTAS","comida_pl"],

  // Lugares singular
  ["PLAYA","lugar"],["CAMPO","lugar"],["PLAZA","lugar"],["BANCO","lugar"],
  ["HOTEL","lugar"],["CALLE","lugar"],["PATIO","lugar"],["MONTE","lugar"],
  ["PARQUE","lugar"],["TIENDA","lugar"],
  // Lugares plural
  ["CASAS","lugar_pl"],["BARES","lugar_pl"],["SALAS","lugar_pl"],["PISTAS","lugar_pl"],

  // Familia y personas singular
  ["MADRE","persona"],["PADRE","persona"],["NIETO","persona"],["NIETA","persona"],
  ["PRIMO","persona"],["PRIMA","persona"],["NOVIO","persona"],["NOVIA","persona"],
  ["AMIGO","persona"],["AMIGA","persona"],["MUJER","persona"],["CHICO","persona"],
  ["CHICA","persona"],
  // Familia y personas plural
  ["NENES","persona_pl"],["NENAS","persona_pl"],["BEBES","persona_pl"],

  // Deportes y actividades singular
  ["TENIS","deporte"],["BAILE","deporte"],["JUEGO","deporte"],["PESCA","deporte"],
  // Deportes y actividades plural
  ["REMOS","deporte_pl"],["SALTOS","deporte_pl"],

  // Casa y objetos singular
  ["SILLA","casa"],["SUELO","casa"],
  ["TECHO","casa"],["BOLSO","casa"],["LLAVE","casa"],["LIBRO","casa"],
  ["PAPEL","casa"],["PLATO","casa"],
  // Casa y objetos plural
  ["VASOS","casa_pl"],["TAZAS","casa_pl"],["CAMAS","casa_pl"],["MESAS","casa_pl"],

  // Verbos
  ["TENER","verbo"],["PONER","verbo"],["ESTAR","verbo"],["SABER","verbo"],
  ["PODER","verbo"],["BEBER","verbo"],["COMER","verbo"],["SALIR","verbo"],
  ["VIVIR","verbo"],["ABRIR","verbo"],["SUBIR","verbo"],["MIRAR","verbo"],
  ["PASAR","verbo"],["SACAR","verbo"],["VOLAR","verbo"],["BAJAR","verbo"],
  ["NADAR","verbo"],["GANAR","verbo"],["DEJAR","verbo"],["LAVAR","verbo"],
  ["JUGAR","verbo"],["CANTAR","verbo"],["BAILAR","verbo"],
  // Verbos en presente
  ["PASAS","verbo_conj"],["COMES","verbo_conj"],["BAJAS","verbo_conj"],["MIRAS","verbo_conj"],
  ["LAVAS","verbo_conj"],["GANAS","verbo_conj"],["BEBES","verbo_conj"],["SUBES","verbo_conj"],
  ["SALES","verbo_conj"],["TIENES","verbo_conj"],["PONES","verbo_conj"],["SABES","verbo_conj"],
  ["PASAN","verbo_conj"],["COMEN","verbo_conj"],["BAJAN","verbo_conj"],["MIRAN","verbo_conj"],
  ["LAVAN","verbo_conj"],["GANAN","verbo_conj"],["BEBEN","verbo_conj"],["SUBEN","verbo_conj"],
  ["SALEN","verbo_conj"],["TIENEN","verbo_conj"],["PONEN","verbo_conj"],["SABEN","verbo_conj"],

  // Adjetivos
  ["BUENO","adjetivo"],["BUENA","adjetivo"],["NUEVO","adjetivo"],["NUEVA","adjetivo"],["FELIZ","adjetivo"],
  ["LARGO","adjetivo"],["CORTO","adjetivo"],["GORDO","adjetivo"],["FLACO","adjetivo"],
  ["VIEJO","adjetivo"],["VIEJA","adjetivo"],["DULCE","adjetivo"],["LINDO","adjetivo"],
  ["LINDA","adjetivo"],["SUCIO","adjetivo"],["CLARO","adjetivo"],

  // Tiempo y naturaleza
  ["NIEVE","tiempo"],["NOCHE","tiempo"],["TARDE","tiempo"],
  ["MARZO","tiempo"],["ENERO","tiempo"],["ABRIL","tiempo"],["CIELO","tiempo"],
  ["HORAS","tiempo"],["JUNIO","tiempo"],["JULIO","tiempo"],

  // Colores
  ["NEGRO","color"],["VERDE","color"],["BEIGE","color"],

  // Transporte singular
  ["METRO","transporte"],["AVION","transporte"],["BARCO","transporte"],["COCHE","transporte"],
  ["VUELO","transporte"],["VIAJE","transporte"],["CARRO","transporte"],
  // Transporte plural
  ["AUTOS","transporte_pl"],["MOTOS","transporte_pl"],["BUSES","transporte_pl"],["BICIS","transporte_pl"],

  // Cuerpo singular
  ["BRAZO","cuerpo"],["NARIZ","cuerpo"],["DOLOR","cuerpo"],["SALUD","cuerpo"],["ARDOR","cuerpo"],
  // Cuerpo plural
  ["MANOS","cuerpo_pl"],["DEDOS","cuerpo_pl"],["PATAS","cuerpo_pl"],["PECAS","cuerpo_pl"],
  ["BOCAS","cuerpo_pl"],["CARAS","cuerpo_pl"],["CODOS","cuerpo_pl"],

  // Números
  ["CINCO","numero"],["SIETE","numero"],["NUEVE","numero"],["TRECE","numero"],

  // Ropa singular
  ["FALDA","ropa"],["GORRO","ropa"],["BOLSO","ropa"],["GORRA","ropa"],["TRAJE","ropa"],
  // Ropa plural
  ["BOTAS","ropa_pl"],["ROPAS","ropa_pl"],
  ["BATAS","ropa_pl"],
];

const CAT_LABELS = {
  animal:       "🐾 Animal",
  animal_pl:    "🐾 Animales (plural)",
  comida:       "🍽️ Comida",
  comida_pl:    "🍽️ Comida (plural)",
  lugar:        "📍 Lugar",
  lugar_pl:     "📍 Lugares (plural)",
  persona:      "👤 Persona o familia",
  persona_pl:   "👤 Personas (plural)",
  deporte:      "⚽ Deportes y actividades",
  deporte_pl:   "⚽ Deportes y actividades (plural)",
  casa:         "🏠 Casa u objeto",
  casa_pl:      "🏠 Objetos de casa (plural)",
  verbo:        "💬 Verbo",
  verbo_conj:   "💬 Verbo en presente",
  adjetivo:     "✨ Adjetivo",
  tiempo:       "☀️ Tiempo o naturaleza",
  color:        "🎨 Color",
  transporte:   "🚗 Transporte",
  transporte_pl:"🚗 Transportes (plural)",
  cuerpo:       "🧍 Cuerpo o salud",
  cuerpo_pl:    "🧍 Partes del cuerpo (plural)",
  numero:       "🔢 Número",
  ropa:         "👕 Ropa",
  ropa_pl:      "👕 Ropa (plural)",
};

function normalize(w) {
  return w.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
}

const WORDS = [];
const WORD_MAP = {};
const seen = new Set();

for (const [w, cat] of WORD_LIST) {
  const n = normalize(w);
  if (n.length === 5 && /^[A-Z]+$/.test(n) && !seen.has(n)) {
    seen.add(n);
    WORDS.push(n);
    WORD_MAP[n] = cat;
  }
}

const ROWS = 6, COLS = 5;
let secret, board, currentRow, currentCol, gameOver, keyState;

function initGame() {
  secret = WORDS[Math.floor(Math.random() * WORDS.length)];
  board = Array.from({length: ROWS}, () => Array(COLS).fill(''));
  currentRow = 0; currentCol = 0; gameOver = false; keyState = {};
  document.getElementById('msg').textContent = '';
  document.getElementById('play-again').style.display = 'none';
  const cat = WORD_MAP[secret];
  document.getElementById('category-hint').textContent = 'Pista: ' + (CAT_LABELS[cat] || cat);
  renderBoard(); renderKeyboard();
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row'; row.id = 'row-' + r;
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile'; tile.id = `tile-${r}-${c}`;
      tile.textContent = board[r][c];
      row.appendChild(tile);
    }
    el.appendChild(row);
  }
}

function renderKeyboard() {
  const layout = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L','Ñ'],
    ['ENTER','Z','X','C','V','B','N','M','⌫']
  ];
  const el = document.getElementById('keyboard');
  el.innerHTML = '';
  for (const row of layout) {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    for (const k of row) {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k; btn.id = 'key-' + k;
      if (keyState[k]) btn.classList.add(keyState[k]);
      btn.addEventListener('click', () => handleKey(k));
      rowEl.appendChild(btn);
    }
    el.appendChild(rowEl);
  }
}

function handleKey(k) {
  if (gameOver) return;
  if (k === '⌫' || k === 'BACKSPACE') {
    if (currentCol > 0) {
      currentCol--;
      board[currentRow][currentCol] = '';
      const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
      tile.textContent = ''; tile.classList.remove('active');
    }
  } else if (k === 'ENTER') {
    submitGuess();
  } else if (/^[A-ZÑ]$/.test(k) && currentCol < COLS) {
    board[currentRow][currentCol] = k;
    const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
    tile.textContent = k;
    tile.classList.add('active','pop');
    setTimeout(() => tile.classList.remove('pop'), 150);
    currentCol++;
  }
}

function submitGuess() {
  if (currentCol < COLS) { shakeRow(currentRow); showMsg('Escribe 5 letras'); return; }
  const guess = board[currentRow].join('');
  const result = evaluate(guess, secret);
  revealRow(currentRow, result);
  updateKeys(guess, result);
  if (guess === secret) {
    const msgs = ['¡Brillante!','¡Excelente!','¡Muy bien!','¡Bien hecho!','¡Bien!','¡Justo!'];
    setTimeout(() => { showMsg(msgs[currentRow] || '¡Correcto!'); endGame(); }, 1800);
  } else if (currentRow === ROWS - 1) {
    setTimeout(() => { showMsg('La palabra era: ' + secret); endGame(); }, 1800);
  }
  currentRow++; currentCol = 0;
}

function evaluate(guess, secret) {
  const result = Array(5).fill('absent');
  const sArr = secret.split(''), gArr = guess.split('');
  const used = Array(5).fill(false);
  for (let i = 0; i < 5; i++) {
    if (gArr[i] === sArr[i]) { result[i] = 'correct'; used[i] = true; }
  }
  for (let i = 0; i < 5; i++) {
    if (result[i] === 'correct') continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && gArr[i] === sArr[j] && result[j] !== 'correct') {
        result[i] = 'present'; used[j] = true; break;
      }
    }
  }
  return result;
}

function revealRow(row, result) {
  for (let c = 0; c < COLS; c++) {
    const tile = document.getElementById(`tile-${row}-${c}`);
    setTimeout(() => {
      tile.classList.add('flip');
      setTimeout(() => { tile.classList.add(result[c]); tile.classList.remove('active'); }, 250);
    }, c * 120);
  }
}

function updateKeys(guess, result) {
  const priority = { correct: 3, present: 2, absent: 1 };
  for (let i = 0; i < 5; i++) {
    const k = guess[i];
    const cur = keyState[k] ? priority[keyState[k]] : 0;
    if ((priority[result[i]] || 0) > cur) keyState[k] = result[i];
  }
  setTimeout(renderKeyboard, 700);
}

function shakeRow(row) {
  const el = document.getElementById('row-' + row);
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 500);
}

function showMsg(t) { document.getElementById('msg').textContent = t; }

function endGame() {
  gameOver = true;
  document.getElementById('play-again').style.display = 'block';
}

document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if (k === 'BACKSPACE') handleKey('⌫');
  else if (k === 'ENTER') handleKey('ENTER');
  else if (/^[A-ZÑ]$/.test(k)) handleKey(k);
});

initGame();
</script>
